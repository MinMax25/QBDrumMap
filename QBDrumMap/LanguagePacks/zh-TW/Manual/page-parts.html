<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<title>聲部</title>
<link href="content.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
<h1>聲部</h1>
<p>編輯鼓聲部和演奏法。</p>
<h2 id="parts">編輯鼓聲部</h2>
<div class="image-wrapper">
<img height="40%" src="image/page-parts_pic_2.png" width="40%"/>
</div>
<ul>
<li class="sub-text">從聲部清單中選擇一個聲部。如果該部分不存在，請新增該部分。</li>
<li class="sub-text">在運音清單中進行設定。</li>
</ul>
<h2 id="articulationlist">演奏法列表 註冊</h2>
<div class="image-wrapper">
<img height="40%" src="image/page-parts_pic_3.png" width="40%"/>
</div>
<p>聲部中使用的演奏法。</p>
<ul>
<li class="sub-text">名稱
                <ul>
<li class="sub-text">輸入關節名稱。</li>
</ul>
</li>
<li class="sub-text">替代運音法
                <ul>
<li class="sub-text">若鼓圖中未使用運音法，則使用此指定的運音法。</li>
</ul>
</li>
</ul>
<h2 id="score">樂譜 配置</h2>
<p class="sub-text">聲部的樂譜顯示設定。點擊樂譜的標題部分以開啟/關閉它。如果不需要鼓樂譜功能，可以保留預設值不變。</p>
<div class="image-wrapper">
<img height="60%" src="image/page-parts_pic_1.png" width="60%"/>
</div>
<p class="note">要設定 Cubase 樂譜，您需要在設定畫面上設定 Cubase 安裝目的地。</p>
</div>
</body>
</html>
