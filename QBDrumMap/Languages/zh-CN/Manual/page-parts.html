<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>声部</title>
<link href="content.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
<h1>声部</h1>
<p>编辑鼓声部和演奏法。</p>
<h2 id="parts">编辑鼓声部</h2>
<div class="image-wrapper">
<img height="40%" src="image/page-parts_pic_2.png" width="40%"/>
</div>
<ul>
<li class="sub-text">从声部列表中选择一个声部。如果该部分不存在，请添加该部分。</li>
<li class="sub-text">在运音列表中进行设置。</li>
</ul>
<h2 id="articulationlist">演奏法列表 注册</h2>
<div class="image-wrapper">
<img height="40%" src="image/page-parts_pic_3.png" width="40%"/>
</div>
<p>声部中使用的演奏法。</p>
<ul>
<li class="sub-text">名称
                <ul>
<li class="sub-text">输入关节名称。</li>
</ul>
</li>
<li class="sub-text">替代运音法
                <ul>
<li class="sub-text">如果鼓图中未使用运音法，则使用此指定的运音法。</li>
</ul>
</li>
</ul>
<h2 id="score">乐谱 配置</h2>
<p class="sub-text">声部的乐谱显示设置。单击乐谱的标题部分可打开/关闭它。如果不需要鼓乐谱功能，可以保留默认值不变。</p>
<div class="image-wrapper">
<img height="60%" src="image/page-parts_pic_1.png" width="60%"/>
</div>
<p class="note">要设置 Cubase 乐谱，您需要在设置屏幕上设置 Cubase 安装目的地。</p>
</div>
</body>
</html>
